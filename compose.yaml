x-app: &app
  build: .
  image: advisor-followup:local
  environment: &env
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/advisor
    SPRING_DATASOURCE_USERNAME: advisor
    SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ADVISOR_PASSWORD: ${ADVISOR_PASSWORD:?Set ADVISOR_PASSWORD}
    SECOND_PASSWORD: ${SECOND_PASSWORD:?Set SECOND_PASSWORD}
    OLLAMA_URL: ${OLLAMA_URL:-}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  depends_on:
    db: {condition: service_healthy}
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: advisor
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  api:
    <<: *app
    ports: ["127.0.0.1:8080:8080"]
  worker-a:
    <<: *app
    environment:
      <<: *env
      WORKER_ID: worker-a
      ACK_DELAY_MS: ${ACK_DELAY_MS:-0}
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
  worker-b:
    <<: *app
    environment:
      <<: *env
      WORKER_ID: worker-b
      ACK_DELAY_MS: ${ACK_DELAY_MS:-0}
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
volumes:
  data:
